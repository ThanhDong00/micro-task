services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: microtask
      POSTGRES_PASSWORD: microtask
      POSTGRES_DB: microtask
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microtask -d microtask"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    build:
      context: ../services/identity
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DATABASE_URL: postgres://microtask:microtask@postgres:5432/microtask
      JWT_SECRET: microtask-dev-secret
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Placeholder service for Ticket 01: a health endpoint that also wires up
  # the shared infra (declares the `micro-task` topic exchange, checks Postgres).
  # Identity/Task/Notification are added in later tickets and wired in here.
  gateway:
    build:
      context: ../services/gateway
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DATABASE_URL: postgres://microtask:microtask@postgres:5432/microtask
      JWT_SECRET: microtask-dev-secret
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_started

volumes:
  postgres-data:
